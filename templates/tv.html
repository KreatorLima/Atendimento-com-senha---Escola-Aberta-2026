<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - SESI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { sesi: { red: '#E30613', navy: '#0A192F', navyLight: '#1E293B', bg: '#0F172A' } }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-border {
            0%, 100% { border-color: #E30613; }
            50% { border-color: #ffffff; }
        }
        .animate-call { animation: pulse-border 1.5s infinite; }
    </style>
</head>
<body class="bg-sesi-bg text-white font-sans min-h-screen flex flex-col justify-between overflow-hidden select-none">

    <header class="bg-sesi-navy border-b border-slate-800 px-8 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center space-x-4">
            <div class="bg-sesi-red text-white px-4 py-1.5 rounded-lg font-black text-3xl tracking-tighter shadow-md">SESI</div>
            <div>
                <h1 class="font-black text-2xl uppercase tracking-wider text-slate-100">Escola SESI</h1>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Painel de Atendimento</p>
            </div>
        </div>
        <div class="text-right">
            <div id="relogioHora" class="text-3xl font-black text-white tracking-widest">00:00:00</div>
            <div id="relogioData" class="text-xs font-bold text-slate-400 uppercase tracking-wider">--/--/----</div>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8 p-8 items-stretch">
        <section class="lg:col-span-2 bg-sesi-navy rounded-3xl border-4 border-sesi-red p-8 flex flex-col justify-between items-center text-center shadow-2xl animate-call">
            <div class="w-full flex justify-between items-center border-b border-slate-800 pb-4">
                <span class="bg-sesi-red text-white text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-widest animate-pulse">Senha Chamada</span>
                <span id="guicheAtual" class="text-slate-300 font-bold text-lg uppercase tracking-wider">---</span>
            </div>
            <div class="my-auto py-6">
                <div id="senhaAtual" class="text-8xl sm:text-9xl font-black text-white tracking-widest drop-shadow-lg">---</div>
                <div id="tipoAtual" class="text-2xl sm:text-3xl font-black text-sesi-red uppercase tracking-wider mt-4">Aguardando Chamada</div>
            </div>
            <div class="w-full bg-sesi-navyLight border border-slate-700/80 rounded-2xl p-4 flex justify-around items-center text-left">
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Responsável</span>
                    <span id="responsavelAtual" class="text-lg font-bold text-slate-100">---</span>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Aluno(a)</span>
                    <span id="alunoAtual" class="text-lg font-bold text-slate-100">---</span>
                </div>
            </div>
        </section>

        <section class="bg-sesi-navy rounded-3xl border border-slate-800 p-6 flex flex-col justify-between shadow-xl">
            <div>
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-800 pb-3">Últimas Chamadas</h2>
                <ul id="listaUltimas" class="space-y-3">
                    <li class="text-center py-10 text-slate-500 font-medium text-sm">Nenhuma chamada anterior.</li>
                </ul>
            </div>
            <div class="pt-4 border-t border-slate-800 text-xs text-slate-500 text-center">Painel TV SESI</div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/tv.js') }}"></script>
</body>
</html>
